name: Handle Stale Items

on:
  schedule:
    - cron: "0 10 * * *"

permissions: {}

jobs:
  stale:
    name: Handle Stale Items
    runs-on: ubuntu-latest
    permissions:
      issues: write # label and close stale issues
      pull-requests: write # label and close stale pull requests
    steps:
      - name: Apply stale policy
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 30
          days-before-close: 7
          operations-per-run: 25
          remove-stale-when-updated: true
          stale-issue-label: "stale"
          exempt-issue-labels: "bug,enhancement,no-stale,help wanted,good first issue"
          stale-issue-message: >
            There hasn't been activity on this issue in 30 days.

            This issue has been marked stale and will be closed in 7 days if no further activity occurs.

            Issues with the labels `bug`, `enhancement`, `no-stale`, `help wanted`, and `good first issue` are exempt
            from this policy.

          stale-pr-label: "stale"
          exempt-pr-labels: "dependencies,no-stale"
          stale-pr-message: >
            There hasn't been any activity on this pull request in 30 days.

            This pull request has been marked stale and will be closed in 7 days if no further activity occurs.

            Pull requests with the label `no-stale` are exempt from this policy.
