name: Release

# Pushing a version tag (v0.1.0-beta.1, v1.2.3, …) builds every target with
# goreleaser (.goreleaser.yaml), publishes a GitHub release with the archives,
# checksums and SBOMs, the container image, and — when their tokens are set —
# the Homebrew cask, Scoop manifest and winget pull request, then attests the
# build provenance of every archive. A tag with a "-" is a pre-release. The
# live suite is not run here by decision (see test.yml); run `make test-live`
# before tagging.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # the GitHub release
  packages: write # the container image on ghcr.io
  id-token: write # build provenance attestations
  attestations: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser reads the tag and the commit date
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      - name: Check the version stamp
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: build --clean --single-target --id saladcloud --output dist/check/saladcloud
        env:
          GOOS: linux
          GOARCH: amd64
      - name: Compare the stamp with the tag
        run: |
          stamped=$(dist/check/saladcloud version -o json | jq -r .version)
          if [ "$stamped" != "$GITHUB_REF_NAME" ]; then
            echo "binary reports version '$stamped', expected '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
      - name: Check the changelog has this release
        # Read through the binary, so this checks the CHANGELOG.md it embeds
        # (what `saladcloud changelog` serves), parsed the way it parses it.
        run: |
          want=${GITHUB_REF_NAME#v}
          today=$(date -u +%F)
          log=$(dist/check/saladcloud changelog -o json)
          date=$(printf '%s' "$log" | jq -r --arg v "$want" '.items[] | select(.version == $v) | .date // empty')
          if [ -z "$date" ]; then
            echo "CHANGELOG.md has no dated section for $want; add \"## [$want] - $today\" above the previous release" >&2
            exit 1
          fi
          if [ "$date" != "$today" ]; then
            echo "::warning::CHANGELOG.md dates $want $date, not today ($today)"
          fi
          if [ -n "$(printf '%s' "$log" | jq -r '.items[] | select(.version == "Unreleased") | .body')" ]; then
            echo "::warning::CHANGELOG.md's Unreleased section is not empty; did its entries belong in $want?"
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install syft (SBOMs)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
