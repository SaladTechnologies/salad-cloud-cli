name: Release

# Pushing a version tag (v0.1.0, v0.2.0-rc.1, …; the scheme is under Releasing
# in AGENTS.md, and `just release` makes one) builds every target with
# goreleaser (.goreleaser.yaml), publishes a GitHub release with the archives,
# checksums and SBOMs, the container image, and — when their tokens are set —
# the Homebrew cask, Scoop manifest and winget pull request, then attests the
# build provenance of every archive. A tag with a "-" is a pre-release. The
# live suite is not run here by decision (see test.yml); run `just test-live`
# before tagging.
#
# Tags are permanent, and re-running a failed run reuses the workflow as it was
# at the tagged commit. So when a release fails in this workflow rather than in
# the tagged code, fix the workflow on main and publish the same tag with it:
# `gh workflow run release.yml -f tag=vX.Y.Z` builds that tag's code with
# main's workflow. It refuses a tag that already has a GitHub release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag (vX.Y.Z) whose release did not publish
        required: true
        type: string

permissions:
  contents: write # the GitHub release
  packages: write # the container image on ghcr.io
  id-token: write # build provenance attestations
  attestations: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    env:
      # The tag being released: the one pushed, or the one asked for by hand.
      TAG: ${{ inputs.tag || github.ref_name }}
      GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0 # goreleaser reads the tag and the commit date
      - name: Check the tag
        # A release tag is vX.Y.Z, or vX.Y.Z-rc.N for a release candidate, on a
        # commit that is on main, with no GitHub release yet. Tags can be
        # neither moved nor deleted, so a tag that breaks a rule stays, but
        # releases nothing.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$'; then
            echo "tag '$TAG' is not vX.Y.Z or vX.Y.Z-rc.N (see Releasing in AGENTS.md)" >&2
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "tag '$TAG' points at $commit, which is not on main" >&2
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already has a GitHub release; delete it first to publish the tag again" >&2
            exit 1
          fi
      - name: Setup Go and just
        uses: ./.github/actions/setup-mise
        with:
          tools: go just
      - name: Vet and test
        run: just vet test
      - name: Check the version stamp
        # The binary goes outside the checkout: --clean empties dist/ first and
        # --output does not create folders, and goreleaser will not release
        # with stray files in the checkout.
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: build --clean --single-target --id saladcloud --output ${{ runner.temp }}/saladcloud
        env:
          GOOS: linux
          GOARCH: amd64
      - name: Compare the stamp with the tag
        run: |
          stamped=$("$RUNNER_TEMP/saladcloud" version -o json | jq -r .version)
          if [ "$stamped" != "$TAG" ]; then
            echo "binary reports version '$stamped', expected '$TAG'" >&2
            exit 1
          fi
      - name: Check the changelog has this release
        # Read through the binary, so this checks the CHANGELOG.md it embeds
        # (what `saladcloud changelog` serves), parsed the way it parses it.
        run: |
          want=${TAG#v}
          today=$(date -u +%F)
          log=$("$RUNNER_TEMP/saladcloud" changelog -o json)
          date=$(printf '%s' "$log" | jq -r --arg v "$want" '.items[] | select(.version == $v) | .date // empty')
          if [ -z "$date" ]; then
            echo "CHANGELOG.md has no dated section for $want; add \"## [$want] - $today\" above the previous release" >&2
            exit 1
          fi
          if [ "$date" != "$today" ]; then
            echo "::warning::CHANGELOG.md dates $want $date, not today ($today)"
          fi
          if [ -n "$(printf '%s' "$log" | jq -r '.items[] | select(.version == "Unreleased") | .body')" ]; then
            echo "::warning::CHANGELOG.md's Unreleased section is not empty; did its entries belong in $want?"
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install syft (SBOMs)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
