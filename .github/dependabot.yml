version: 2
updates:
  # Actions are pinned by commit SHA; Dependabot bumps the SHA and its
  # version comment together.
  - package-ecosystem: github-actions
    # The workflows, and the local setup-mise action's own pinned actions.
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    labels: [dependencies]
  # The SDK stays pinned on purpose (its types are the API model); Dependabot
  # reports when it moves so the bump is a deliberate change.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
