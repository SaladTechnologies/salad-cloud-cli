name: Request a feature
description: Let us know if you have ideas for things you would like the CLI to do.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for taking the time to fill out this feature request! We encourage you to start with a [GitHub
        discussion](https://github.com/SaladTechnologies/salad-cloud-cli/discussions) to ensure this fits in the
        roadmap. If this issue is security related, please disclose vulnerabilities to us responsibly as a [GitHub
        security advisory](https://github.com/SaladTechnologies/salad-cloud-cli/security/advisories/new).
  - type: textarea
    id: feature
    attributes:
      label: What do you want?
      description: Please provide as much information as possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Why is it needed?
      description: What are you trying to do, and what do you do today instead?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else we should know?
